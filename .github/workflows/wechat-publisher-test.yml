name: Test WeChat Publisher

on:
  push:
    branches: [main, draft]
    paths:
      - 'tools/wechat-publisher/**'
      - 'articles/**'
      - 'examples/**'
      - '.github/scripts/sync_examples.py'
      - '.github/workflows/wechat-publisher-test.yml'
  pull_request:
    branches: [main, draft]
    paths:
      - 'tools/wechat-publisher/**'
      - 'articles/**'
      - 'examples/**'
      - '.github/scripts/sync_examples.py'
      - '.github/workflows/wechat-publisher-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and test WeChat Publisher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/wechat-publisher
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/wechat-publisher/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check article/example synchronization
        working-directory: .
        run: python3 .github/scripts/sync_examples.py

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
