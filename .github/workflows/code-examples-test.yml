name: Test Code Examples

on:
  push:
    branches: [main, draft]
  pull_request:
    branches: [main, draft]
  workflow_dispatch:

jobs:
  test-cangjie:
    name: Test Canonical Cangjie Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check article/example synchronization
        run: python3 .github/scripts/sync_examples.py

      - name: Download Cangjie 1.0.5 LTS SDK
        run: |
          wget --https-only --no-verbose \
            'https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.0.5.tar.gz&objectKey=698acf46bd66ae22b62330b0' \
            -O cangjie-sdk-linux-x64-1.0.5.tar.gz
          printf '%s  %s\n' \
            'bacad84df8e0281c5395bab4c40e481e3ea6cc712eed5c953903b0d561a14562' \
            'cangjie-sdk-linux-x64-1.0.5.tar.gz' | sha256sum --check

      - name: Install Cangjie SDK
        run: |
          tar -xzf cangjie-sdk-linux-x64-1.0.5.tar.gz
          sudo mv cangjie /opt/cangjie
          echo "/opt/cangjie/bin" >> "$GITHUB_PATH"

      - name: Verify Cangjie installation
        run: cjc --version

      - name: Compile and run canonical examples
        run: bash tools/test-local.sh
